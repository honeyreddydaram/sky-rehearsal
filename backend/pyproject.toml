[project]
name = "sky-rehearsal-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "firebase-admin>=7.7.0",
    "google-cloud-speech>=2,<3",
    "google-genai>=1.0,<3",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
