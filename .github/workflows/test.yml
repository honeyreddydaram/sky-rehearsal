name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --project backend --frozen
      - run: uv run --project backend --frozen pytest backend/tests
      - run: docker build --file backend/Dockerfile --tag sky-rehearsal:test .
      - run: docker run --rm --entrypoint /app/.venv/bin/python sky-rehearsal:test -c "from app.main import app; from app.catalog import airport_catalog; assert 'VOHY' in airport_catalog()"

  firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: npm ci
      - run: uv sync --project backend --frozen
      - run: npx playwright install --with-deps chromium
      - run: npm run test:firebase

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform -chdir=deploy fmt -check
      - run: terraform -chdir=deploy init -backend=false -input=false
      - run: terraform -chdir=deploy validate
